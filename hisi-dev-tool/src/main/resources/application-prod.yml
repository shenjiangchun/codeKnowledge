# 生产环境配置

# CORS 配置 - 生产环境必须通过环境变量配置允许的源
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}  # 生产环境无默认值，必须配置

llm:
  base-url: http://xxxxx/v1/chat/completions
  api-key: ${LLM_API_KEY:placeholder}  # 从环境变量读取API密钥
  timeout: 60000  # 生产环境增加超时时间

# 生产环境禁用Swagger
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# 生产环境日志配置
logging:
  level:
    root: info
    com.example.llmapi: info
    org.springframework.web: warn