# ============================================================
# Neo4j Docker Compose Configuration
# 用于 hisi-dev-tool 知识图谱存储和 GraphRAG 检索
# ============================================================
# 使用方法:
#   启动: docker-compose -f docker-compose.neo4j.yml up -d
#   停止: docker-compose -f docker-compose.neo4j.yml down
#   查看日志: docker-compose -f docker-compose.neo4j.yml logs -f neo4j
# ============================================================

version: '3.8'

services:
  neo4j:
    image: neo4j:5.15.0
    container_name: hisi-dev-tool-neo4j
    restart: unless-stopped

    ports:
      - "7474:7474"   # HTTP API 和 Neo4j Browser
      - "7687:7687"   # Bolt 协议 (客户端连接)

    environment:
      # 认证配置
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-***REMOVED_NEO4J_PASSWORD***}

      # 插件配置 (APOC 和 GDS)
      - NEO4J_PLUGINS=["apoc", "gds"]

      # 内存配置
      - NEO4J_server_memory_pagecache_size=512M
      - NEO4J_server_memory_heap_initial__size=512M
      - NEO4J_server_memory_heap_max__size=1G
      - NEO4J_server_memory_transaction_total__max=256M

      # 数据库配置
      - NEO4J_dbms_default__database=code
      - NEO4J_dbms_tx__log_rotation_retention__policy=100M size

      # APOC 配置
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      - NEO4J_apoc_export_file_enabled=true

      # GDS 配置
      - NEO4J_gds_enabled=true

      # 日志配置
      - NEO4J_server_logs_debug_level=INFO

      # 查询配置
      - NEO4J_server_default__listen__address=0.0.0.0
      - NEO4J_server_bolt_advertised__address=:7687
      - NEO4J_server_http_advertised__address=:7474

      # 允许从外部访问
      - NEO4J_server_bolt_enabled=true
      - NEO4J_server_http_enabled=true

    volumes:
      # 数据持久化
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
      # 初始化脚本挂载 (可选)
      - ./docs/neo4j/schema:/var/lib/neo4j/init-scripts:ro

    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-***REMOVED_NEO4J_PASSWORD***} RETURN 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    networks:
      - hisi-dev-tool-network

networks:
  hisi-dev-tool-network:
    driver: bridge

volumes:
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  neo4j_import:
    driver: local
  neo4j_plugins:
    driver: local
