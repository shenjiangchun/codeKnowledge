# Test profile — provides dummy defaults so @SpringBootTest can load
# without real API keys, Neo4j, or production SQLite database.
#
# IMPORTANT: Do NOT use jdbc:sqlite::memory: — each HikariCP connection
# gets its own isolated in-memory database, so tables created on connection A
# are invisible to connection B.

# File-based SQLite with single connection to avoid HikariCP pool issues.
spring.datasource.url=jdbc:sqlite:target/test-devtool.db?foreign_keys=on
spring.datasource.hikari.maximum-pool-size=1

# Dummy API keys for Spring AI auto-config.
spring.ai.anthropic.api-key=test-anthropic-key
spring.ai.openai.api-key=test-openai-key

# Deactivate ApmClaudeLlmClient (its @ConditionalOnExpression checks for non-empty key).
hisi.apm.diagnose.llm.api-key=

# Server
server.port=8080

# Project directory
app.project_dir=/tmp/test-project

# LLM Service
llm.api.url=http://localhost:8081/api

# Logging
logging.level.com.huawei.hisi=DEBUG
logging.level.org.springframework=INFO
