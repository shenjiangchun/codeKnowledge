# Test profile - provides dummy defaults for Spring AI auto-config
# and a dedicated SQLite DB so @SpringBootTest doesn't touch production devtool.db.
spring:
  datasource:
    url: "jdbc:sqlite:target/test-devtool.db?foreign_keys=on"
    hikari:
      maximum-pool-size: 1
  ai:
    anthropic:
      api-key: test-anthropic-key
    openai:
      api-key: test-openai-key

# Explicitly empty to prevent ApmClaudeLlmClient activation
# (its @ConditionalOnExpression checks for non-empty api-key).
hisi:
  apm:
    diagnose:
      llm:
        api-key: ""
