<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="900" viewBox="0 0 1180 900" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="hdr3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e3a5f"/><stop offset="1" stop-color="#2c5282"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1180" height="900" rx="10" fill="#f0f2f5" stroke="#d0d7de"/>
  <rect x="0" y="0" width="1180" height="42" rx="10" fill="url(#hdr3)"/>
  <circle cx="24" cy="21" r="6" fill="#ff5f57"/><circle cx="44" cy="21" r="6" fill="#febc2e"/><circle cx="64" cy="21" r="6" fill="#28c840"/>
  <text x="590" y="26" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">架构诊断 — AI 深度分析报告</text>

  <!-- 侧边栏 -->
  <rect x="0" y="42" width="170" height="858" fill="#263445"/>
  <g fill="#cfd8e3" font-size="13">
    <rect x="10" y="95" width="150" height="34" rx="5" fill="#31465c"/><text x="28" y="117">知识图谱</text>
    <rect x="10" y="137" width="150" height="34" rx="5" fill="#409eff"/><text x="28" y="159" fill="#fff" font-weight="600">架构诊断</text>
    <rect x="10" y="179" width="150" height="34" rx="5" fill="#31465c"/><text x="28" y="201">调用链</text>
    <rect x="10" y="221" width="150" height="34" rx="5" fill="#31465c"/><text x="28" y="243">日志分析</text>
    <rect x="10" y="263" width="150" height="34" rx="5" fill="#31465c"/><text x="28" y="285">RAM 需求分析</text>
  </g>

  <!-- 顶部：完成状态 + 导出 -->
  <rect x="190" y="62" width="970" height="64" rx="8" fill="#fff" stroke="#e4e7ed"/>
  <circle cx="222" cy="94" r="10" fill="#67c23a"/>
  <text x="218" y="99" text-anchor="middle" fill="#fff" font-size="12">✓</text>
  <text x="244" y="90" fill="#303133" font-size="15" font-weight="600">AI 深度分析完成</text>
  <text x="244" y="110" fill="#909399" font-size="12">耗时 2 分 41 秒 · 3/3 节点 · 证据包 12.4 KB · 基于 10:32:15 实时报告</text>
  <rect x="860" y="76" width="110" height="34" rx="5" fill="#fff" stroke="#c0c4cc"/>
  <text x="915" y="98" text-anchor="middle" fill="#606266" font-size="13">导出 Markdown</text>
  <rect x="982" y="76" width="150" height="34" rx="5" fill="#409eff"/>
  <text x="1057" y="98" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">✦ 重新深度分析</text>

  <!-- Tab 切换：实时报告 / 深度分析 -->
  <g font-size="13">
    <rect x="210" y="146" width="100" height="30" rx="5" fill="#f5f7fa"/><text x="260" y="166" text-anchor="middle" fill="#606266">实时报告</text>
    <rect x="318" y="146" width="120" height="30" rx="5" fill="#409eff"/><text x="378" y="166" text-anchor="middle" fill="#fff" font-weight="600">AI 深度分析</text>
  </g>

  <!-- 报告正文卡片 -->
  <rect x="190" y="192" width="970" height="688" rx="8" fill="#fff" stroke="#e4e7ed"/>

  <!-- Markdown 渲染的标题 -->
  <text x="230" y="240" fill="#303133" font-size="20" font-weight="700">hisi-dev-tool 架构现状及问题分析报告</text>
  <text x="230" y="264" fill="#909399" font-size="11">AI 生成 · 2026-09-29 10:36 · 引用证据 5 类（诊断四章 / KG 环 / 类度量 / 方法热点 / 代码摘录）</text>

  <!-- 目录 -->
  <rect x="230" y="284" width="900" height="36" rx="5" fill="#f5f7fa"/>
  <text x="246" y="307" fill="#606266" font-size="12">一、架构现状总览　二、核心问题及根因分析　三、改进建议与优先级　四、附录：证据清单</text>

  <!-- 一、现状 -->
  <text x="230" y="352" fill="#303133" font-size="15" font-weight="600">一、架构现状总览</text>
  <g font-size="12" fill="#606266">
    <text x="230" y="376">项目当前健康分 <tspan fill="#409eff" font-weight="600">75（B 级）</tspan>，共 139 个方法、7 个领域。整体呈 controller → service</text>
    <text x="230" y="396">→ repository 的标准分层形态，但存在 <tspan fill="#f56c6c">3 个包级循环依赖</tspan>与 <tspan fill="#e6a23c">12 处分层违规</tspan>。</text>
  </g>

  <!-- 二、根因 -->
  <text x="230" y="440" fill="#303133" font-size="15" font-weight="600">二、核心问题及根因分析</text>
  <!-- 根因卡片 1 -->
  <rect x="230" y="456" width="900" height="96" rx="6" fill="#fdf0f0" stroke="#f56c6c"/>
  <rect x="244" y="468" width="120" height="20" rx="10" fill="#f56c6c"/><text x="304" y="482" text-anchor="middle" fill="#fff" font-size="11">问题 1 · HIGH</text>
  <text x="376" y="482" fill="#303133" font-size="12" font-weight="600">repository → controller 反向依赖（3 处）</text>
  <g font-size="12" fill="#606266">
    <text x="244" y="506">根因：OrderMapper 等 Mapper 直接注入 Controller 用于统计报表导出，绕过 service 层。</text>
    <text x="244" y="526">证据：<tspan fill="#409eff">repository/OrderMapper.java:42</tspan> · 关联环 CROSS_LAYER（controller→service→repository→controller）</text>
    <text x="244" y="546">建议：抽取 StatsQueryService 承载报表查询，Controller 仅调用 service。</text>
  </g>
  <!-- 根因卡片 2 -->
  <rect x="230" y="564" width="900" height="96" rx="6" fill="#fdf6ec" stroke="#e6a23c"/>
  <rect x="244" y="576" width="140" height="20" rx="10" fill="#e6a23c"/><text x="314" y="590" text-anchor="middle" fill="#fff" font-size="11">问题 2 · MEDIUM</text>
  <text x="396" y="590" fill="#303133" font-size="12" font-weight="600">service.a ⇄ service.b 同层互依（职责边界模糊）</text>
  <g font-size="12" fill="#606266">
    <text x="244" y="614">根因：UserService 与 OrderService 相互调用完成订单归属校验，缺乏领域接口隔离。</text>
    <text x="244" y="634">证据：KG ego-net · 互调边 ×4 · 涉及类 UserServiceImpl / OrderServiceImpl</text>
    <text x="244" y="654">建议：引入 OrderOwnershipValidator 领域服务打破互依。</text>
  </g>
  <!-- 优先级表 -->
  <text x="230" y="700" fill="#303133" font-size="15" font-weight="600">三、改进建议与优先级（先修这三个）</text>
  <rect x="230" y="716" width="900" height="110" rx="6" fill="#fafafa" stroke="#e4e7ed"/>
  <g font-size="12" fill="#606266">
    <text x="246" y="740"><tspan fill="#f56c6c" font-weight="700">P0</tspan>　抽取 StatsQueryService —— 消除 3 处反向依赖，收益最大（循环依赖 -1，违规 -3）</text>
    <text x="246" y="766"><tspan fill="#e6a23c" font-weight="700">P1</tspan>　领域服务打破 service 互依 —— 环依赖 -1</text>
    <text x="246" y="792"><tspan fill="#909399" font-weight="700">P2</tspan>　JsonUtils 工具类去 controller 依赖 —— 违规 -1，随 P0 顺手完成</text>
  </g>

  <!-- 附录提示 -->
  <text x="230" y="858" fill="#909399" font-size="11">四、附录：证据清单（12.4 KB，含代码摘录与 KG 查询快照）· 支持展开查看每条结论的原始依据</text>
</svg>
